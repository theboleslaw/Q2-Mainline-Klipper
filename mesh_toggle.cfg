[gcode_macro TOGGLE_MESH]
description: Toggle automatic bed mesh probing
gcode:
    {% set current = printer.save_variables.variables.enable_auto_mesh | default(True) %}
    SAVE_VARIABLE VARIABLE=enable_auto_mesh VALUE={not current}
    RESPOND MSG="Auto Bed Mesh: {'ENABLED' if not current else 'DISABLED'}"

[delayed_gcode INIT_MESH_VAR]
initial_duration: 1
gcode:
    {% if printer.save_variables.variables.enable_auto_mesh is not defined %}
        SAVE_VARIABLE VARIABLE=enable_auto_mesh VALUE=True
    {% endif %}

# Mainsail's Miscellaneous panel lists output_pin objects. This virtual pin has
# no hardware behind it; it mirrors enable_auto_mesh so the toggle stays in sync
# with TOGGLE_MESH and PRINT_START.
[mesh_toggle_pin]
pin_name: mesh_toggle
